<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .choice {
            font-size: 50px;
            cursor: pointer;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Rock-Paper-Scissors Game</h1>
    <div>
        <span class="choice" onclick="play('rock')">✊</span>
        <span class="choice" onclick="play('paper')">✋</span>
        <span class="choice" onclick="play('scissors')">✌️</span>
    </div>
    <h2 id="result"></h2>

    <script>
        function play(userChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            let result = '';

            if (userChoice === computerChoice) {
                result = "It's a tie!";
            } else if (
                (userChoice === 'rock' && computerChoice === 'scissors') ||
                (userChoice === 'paper' && computerChoice === 'rock') ||
                (userChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = 'You win!';
            } else {
                result = 'You lose!';
            }

            document.getElementById('result').innerText = You chose ${userChoice}, computer chose ${computerChoice}. ${result};
        }
    </script>
</body>
</html>
